<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes liens — Annecy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #14181C;
    --bg-elevated: #1D2329;
    --card: #212831;
    --card-hover: #2A323C;
    --text: #EDEFF2;
    --text-soft: #A7B0BB;
    --text-dim: #6E7783;

    --scolarite: #6C8EF5;
    --logement: #F5A85C;
    --sport: #4FD6A8;
    --transport: #C792EA;
    --restauration: #F5738C;
    --divertissement: #FFD166;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  .wrap{
    max-width: 1040px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  header{
    padding: 10px 0 24px;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 6vw, 38px);
    line-height: 1.15;
    margin: 0 0 8px;
  }

  header p{
    color: var(--text-soft);
    font-size: 15px;
    margin: 0;
    line-height: 1.5;
  }

  .pills{
    display:flex;
    gap: 8px;
    overflow-x: auto;
    padding: 22px 0 6px;
    margin-bottom: 6px;
    scrollbar-width: none;
  }
  .pills::-webkit-scrollbar{ display:none; }

  .pill{
    flex: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 100px;
    background: var(--bg-elevated);
    color: var(--text-soft);
    border: 1px solid transparent;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap: 7px;
    transition: transform .12s ease, background-color .15s ease;
  }
  .pill:active{ transform: scale(0.96); }
  .pill.active{
    color: var(--bg);
    background: var(--pill-color, #fff);
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 18px;
  }
  @media (min-width: 640px){
    .grid{ grid-template-columns: repeat(3, 1fr); gap: 14px; }
  }
  @media (min-width: 900px){
    .grid{ grid-template-columns: repeat(4, 1fr); gap: 16px; }
  }

  .card{
    position: relative;
    background: var(--card);
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.05);
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 128px;
    text-decoration: none;
    color: var(--text);
    transition: background-color .15s ease, transform .12s ease;
  }
  .card:active{ transform: scale(0.98); }
  @media (hover:hover){
    .card:hover{ background: var(--card-hover); }
  }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content: space-between;
  }

  .emoji{
    font-size: 26px;
    line-height:1;
  }

  .dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 6px;
    flex: none;
  }

  .card-name{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.25;
    margin: 0;
    flex: 1;
  }

  .info-btn{
    position: absolute;
    top: 12px;
    right: 12px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    color: var(--text-soft);
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    z-index: 2;
  }
  .info-btn:active{ transform: scale(0.9); }

  .card-desc{
    font-size: 13px;
    color: var(--text-soft);
    line-height: 1.45;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height .25s ease, opacity .2s ease;
  }
  .card-desc.open{
    max-height: 120px;
    opacity: 1;
  }

  .card-host{
    margin-top: auto;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  footer{
    margin-top: 40px;
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Tous tes liens, Annecy 🏔️</h1>
    <p>Tape sur une carte pour ouvrir le lien. Tape sur le <strong>?</strong> pour lire c'est quoi.</p>
  </header>

  <div class="pills" id="pills"></div>
  <div class="grid" id="grid"></div>

  <footer>Fait avec 🧡 pour ton année à l'IAE</footer>
</div>

<script>
  const categories = [
    { key: "scolarite", label: "Scolarité", emoji: "🎓", color: "var(--scolarite)" },
    { key: "logement", label: "Logement", emoji: "🏠", color: "var(--logement)" },
    { key: "sport", label: "Sport", emoji: "🏀", color: "var(--sport)" },
    { key: "transport", label: "Transport", emoji: "🚌", color: "var(--transport)" },
    { key: "restauration", label: "Bouffe", emoji: "🍽️", color: "var(--restauration)" },
    { key: "divertissement", label: "Sorties", emoji: "🎬", color: "var(--divertissement)" },
  ];

  const items = [
    { name: "Espace étudiant IAE", url: "https://espace-etudiant.univ-smb.fr/", desc: "Emploi du temps, mails, Moodle, événements et vie étudiante. Ton point de départ tous les jours.", cat: "scolarite", importance: "grande" },
    { name: "Moodle", url: "https://moodle.univ-smb.fr/", desc: "Tous les cours et les documents des profs.", cat: "scolarite", importance: "grande" },
    { name: "Site IAE Savoie Mont Blanc", url: "https://www.iae.univ-smb.fr/", desc: "Actus, contacts et infos sur les formations.", cat: "scolarite", importance: "moyenne" },
    { name: "Pré Saint-Jean", url: "https://residence-presaintjean-n-w5qkysv.gamma.site/", desc: "Newsletter de ta résidence étudiante.", cat: "logement", importance: "moyenne" },
    { name: "Espace Sport", url: "https://mon-espace-service-sports.univ-smb.fr/my/#courses", desc: "Inscris-toi aux activités sportives de la fac.", cat: "sport", importance: "moyenne" },
    { name: "SIBRA", url: "https://www.sibra.fr/", desc: "Horaires et abonnements bus à Annecy.", cat: "transport", importance: "moyenne" },
    { name: "IZLY", url: "https://izly.fr/", desc: "Compte pour payer au resto U (t'as aussi l'appli).", cat: "restauration", importance: "faible" },
    { name: "Cinéma", url: "https://mon.allocine.fr/mes-cinemas/", desc: "Toutes les séances des cinémas d'Annecy.", cat: "divertissement", importance: "faible" },
    { name: "Bonlieu", url: "https://bonlieu-annecy.com/", desc: "Concerts, spectacles, théâtre à la scène nationale.", cat: "divertissement", importance: "faible" },
    { name: "Spectacles du lac", url: "https://www.lac-annecy.com/agenda/billetterie-et-spectacles-en-vente-en-ligne/", desc: "Billetterie et agenda des events autour du lac.", cat: "divertissement", importance: "faible" },
  ];

  const importanceDot = { grande: 1, moyenne: 0.65, faible: 0.35 };
  const importanceOrder = { grande: 0, moyenne: 1, faible: 2 };

  function hostOf(url){
    try{ return new URL(url).hostname.replace(/^www\./,''); }
    catch(e){ return url; }
  }

  let activeCat = "all";

  function renderPills(){
    const pillsEl = document.getElementById('pills');
    const all = document.createElement('button');
    all.className = 'pill active';
    all.textContent = '✨ Tout';
    all.dataset.key = 'all';
    pillsEl.appendChild(all);

    categories.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'pill';
      btn.style.setProperty('--pill-color', c.color);
      btn.dataset.key = c.key;
      btn.innerHTML = `${c.emoji} ${c.label}`;
      pillsEl.appendChild(btn);
    });

    pillsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.pill');
      if(!btn) return;
      activeCat = btn.dataset.key;
      [...pillsEl.children].forEach(p => p.classList.toggle('active', p === btn));
      renderGrid();
    });
  }

  function renderGrid(){
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    const filtered = items
      .filter(i => activeCat === 'all' || i.cat === activeCat)
      .sort((a,b) => importanceOrder[a.importance] - importanceOrder[b.importance]);

    filtered.forEach((item, idx) => {
      const cat = categories.find(c => c.key === item.cat);
      const card = document.createElement('a');
      card.className = 'card';
      card.href = item.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      const descId = `desc-${idx}`;

      card.innerHTML = `
        <button class="info-btn" type="button" aria-expanded="false" aria-controls="${descId}">?</button>
        <div class="card-top">
          <span class="emoji">${cat.emoji}</span>
          <span class="dot" style="background:${cat.color}; opacity:${importanceDot[item.importance]}"></span>
        </div>
        <p class="card-name">${item.name}</p>
        <p class="card-desc" id="${descId}">${item.desc}</p>
        <p class="card-host">${hostOf(item.url)}</p>
      `;

      const infoBtn = card.querySelector('.info-btn');
      const descEl = card.querySelector('.card-desc');
      infoBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const isOpen = descEl.classList.toggle('open');
        infoBtn.style.background = isOpen ? cat.color : '';
        infoBtn.style.color = isOpen ? '#14181C' : '';
        infoBtn.setAttribute('aria-expanded', String(isOpen));
      });

      gridEl.appendChild(card);
    });
  }

  renderPills();
  renderGrid();
</script>

</body>
</html>
